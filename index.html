<style>
    /* スマホ特有のタップ時のハイライトやテキスト選択を無効化 */

        transform: rotateY(180deg);
    }
    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        border-radius: 16px;
        text-align: center;

        color: #333;
        border: 2px solid #e0e0e0;
    }
    .card-back {
        background-color: #e85a4f;
        color: white;

    }
    .question-text {
        font-size: 1.2em;
        line-height: 1.6;

    }
    .answer-text {
        font-size: 1.8em;
        font-weight: bold;
    }

        justify-content: space-between;

        border-radius: 8px;
        background-color: #4a4e69;
        color: white;
        cursor: pointer;
        flex: 1;

    }
    .progress {
        margin-top: 15px;
        font-weight: bold;
        color: #555;

</head>
<body>

<h1>世界史一問一答 第2章</h1>
<div class="instruction">タップで解答 / 左右スワイプでカード移動</div>

<div class="card-container" id="cardContainer">

            <div class="question-text" id="question"></div>
        </div>
        <div class="card-face card-back">
            <div class="answer-text" id="answer"></div>
        </div>
    </div>
</div>

<div class="controls">
    <button onclick="prevCard()">◀ 前へ</button>
    <button onclick="shuffleCards()">🔀 シャッフル</button>
    <button onclick="nextCard()">次へ ▶</button>
</div>
<div class="progress" id="progress"></div>

    let currentIndex = 0;
    const card = document.getElementById('flashcard');
    
    function updateCard() {
        card.classList.remove('is-flipped');
        setTimeout(() => {
            document.getElementById('question').textContent = flashcards[currentIndex].q;
            document.getElementById('answer').textContent = flashcards[currentIndex].a;
            document.getElementById('progress').textContent = `${currentIndex + 1} / ${flashcards.length}`;
        }, 150); 
    }

    function flipCard() {
        card.classList.toggle('is-flipped');
    }

    function nextCard() {
        if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    function shuffleCards() {
        for (let i = flashcards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
        }
        currentIndex = 0;
        updateCard();
    }

    // タップで裏返す
    document.getElementById('cardContainer').addEventListener('click', flipCard);

    // スワイプ操作（フリック）の検知
    let touchstartX = 0;
    let touchendX = 0;

    document.getElementById('cardContainer').addEventListener('touchstart', e => {
        touchstartX = e.changedTouches[0].screenX;
    });

    document.getElementById('cardContainer').addEventListener('touchend', e => {
        touchendX = e.changedTouches[0].screenX;
        handleGesture();
    });

    function handleGesture() {
        const swipeThreshold = 50; // これ以上指を動かしたらスワイプと判定
        if (touchendX < touchstartX - swipeThreshold) {
            nextCard(); // 左へスワイプ（次へ）
        }
        if (touchendX > touchstartX + swipeThreshold) {
            prevCard(); // 右へスワイプ（前へ）
        }
    }

    updateCard();
